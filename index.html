<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Medidas" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <title>Medidas</title>
</head>
<body>
  <main class="app" aria-label="Conversor de medidas">
    <header><h1 id="app-title">Medidas - Distância</h1><button class="history-open" id="history-open" type="button">Histórico</button></header>
    <section class="converter">
      <div class="readouts">
        <label class="readout active" data-field="top"><span id="top-unit">Metros</span><input id="top-value" inputmode="decimal" autocomplete="off" value="1" readonly aria-label="Valor em metros" /></label>
        <button class="clear" id="clear" aria-label="Limpar valores">×</button>
        <label class="readout" data-field="bottom"><span id="bottom-unit">Feet</span><input id="bottom-value" inputmode="decimal" autocomplete="off" value="3,28" readonly aria-label="Valor em feet" /></label>
      </div>
      <div class="workspace">
        <nav class="categories" aria-label="Categorias">
          <button class="category active" data-category="distance">Distância</button>
          <button class="category" data-category="weight">Peso</button>
          <button class="category" data-category="volume">Volume</button>
          <button class="category" data-category="temperature">Temperatura</button>
        </nav>
        <section class="keypad" aria-label="Teclado numérico">
          <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
          <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
          <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
          <button data-key=".">,</button><button data-key="0">0</button><button class="erase" data-key="delete" aria-label="Apagar">⌫</button>
        </section>
        <aside class="units" aria-label="Unidades"><div id="unit-list"></div></aside>
      </div>
    </section>
    <aside class="history-panel" id="history-panel" hidden aria-label="Últimas conversões">
      <div class="history-head"><strong>Últimas conversões</strong><button id="history-close" type="button" aria-label="Fechar histórico">×</button></div>
      <div id="history-list" class="history-list"></div>
    </aside>
  </main>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script src="app.js"></script>
</body>
</html>
